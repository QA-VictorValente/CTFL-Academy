version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ctfl_academy_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ctfl_academy}
    ports:
      - '5432:5432'
    volumes:
      - ctfl_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d ctfl_academy']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ctfl_pgdata:
